<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08080a" />
  <title>The-Keyboard — a grand piano on your keyboard</title>
  <link rel="stylesheet" href="static/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>The&nbsp;Keyboard</h1>
    <p class="tagline">Your keyboard, reborn as a grand piano.</p>
  </header>

  <main>
    <div class="console">
      <div class="controls">
        <button id="remap-toggle" class="btn" title="Click a piano key, then press a keyboard key to map it">Remap</button>
        <button id="reset-btn" class="btn" title="Restore the default mapping">Reset</button>
        <label class="volume"><span>Volume</span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" /></label>
      </div>

      <p id="status" class="status">Press a key to play&hellip;</p>

      <div class="piano-shell">
        <div class="fallboard"><span class="brand">THE&nbsp;KEYBOARD</span></div>
        <div class="piano">
          <div class="keys-area" id="keys-area"></div>
        </div>
      </div>

      <p id="remap-banner" class="banner hidden"><span id="banner-text"></span></p>

      <section class="mapping-panel">
        <h2>Current mapping</h2>
        <div id="mapping-list" class="mapping-list"></div>
      </section>
    </div>
  </main>

  <footer>
    <p>Hold keys to sustain &middot; click piano keys with the mouse &middot; <kbd>Esc</kbd> cancels remapping &middot; your setup is saved in the browser</p>
  </footer>

  <script src="static/app.js"></script>
</body>
</html>
